<!doctype html><html><head><meta charset="utf-8"><title>Class Diagram Klinik</title>
<style>
body{margin:0;background:#fff;font-family:"Segoe UI",Arial,sans-serif;color:#1a1a1a}
#canvas{position:relative;width:2260px}
h1{position:absolute;left:40px;top:24px;margin:0;font-size:30px}
#sub{position:absolute;left:40px;top:66px;font-size:17px;color:#555}
.cls{position:absolute;border:2px solid #2f3b4c;background:#fff;font-size:14.5px;line-height:1.45;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
.cls .hd{text-align:center;padding:6px 8px;font-weight:700;font-size:17px;border-bottom:2px solid #2f3b4c}
.cls .st{display:block;font-weight:400;font-style:italic;font-size:13px}
.cls .sec{padding:5px 10px;white-space:nowrap}
.cls .sec+.sec{border-top:2px solid #2f3b4c}
.u{text-decoration:underline}
.entity .hd{background:#dbe8fb}.adt .hd{background:#d7eed3}.app .hd{background:#fdf0c8}
svg{position:absolute;left:0;top:0;overflow:visible;z-index:2;pointer-events:none}
.lbl{font-size:14px;fill:#1a1a1a;paint-order:stroke;stroke:#fff;stroke-width:5px}
.lbl.name{font-style:italic;fill:#26408b}
#legend{position:absolute;font-size:14px;border:1.5px solid #999;padding:10px 14px;background:#fafafa;line-height:1.7}
</style></head><body><div id="canvas"><h1>Class Diagram &ndash; Sistem Klinik Rawat Jalan</h1>
<div id="sub">Ahmad Raihan Al-Biruni (22315021) &middot; Topik: Klinik Rawat Jalan &middot; ADT: Sorted List (array terurut)</div>
<svg id="svg"><defs>
<marker id="open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#2f3b4c" stroke-width="2"/></marker>
<marker id="tri" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L19,10 L1,19 Z" fill="#fff" stroke="#2f3b4c" stroke-width="2"/></marker>
<marker id="dia0" viewBox="0 0 26 14" refX="1" refY="7" markerWidth="26" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,7 L13,1 L25,7 L13,13 Z" fill="#fff" stroke="#2f3b4c" stroke-width="2"/></marker>
<marker id="dia1" viewBox="0 0 26 14" refX="1" refY="7" markerWidth="26" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,7 L13,1 L25,7 L13,13 Z" fill="#2f3b4c" stroke="#2f3b4c" stroke-width="2"/></marker>
</defs></svg></div>
<script>
const SRC = "classDiagram\n    direction TB\n\n    class MemilikiKunci {\n        <<interface>>\n        +getKunci() String\n    }\n\n    class SortedList~T~ {\n        <<ADT, T extends MemilikiKunci>>\n        -KAPASITAS_DEFAULT: int = 10$\n        -data: Object[]\n        -kapasitas: int\n        -jumlah: int\n        +SortedList()\n        +SortedList(kapasitas: int)\n        +insert(item: T) boolean\n        +remove(kunci: String) T\n        +search(kunci: String) int\n        +get(index: int) T\n        +tampilkan() void\n        +size() int\n        +isEmpty() boolean\n        +isFull() boolean\n        +getKapasitas() int\n        -bandingkan(a: String, b: String) int\n        -ambil(index: int) T\n    }\n\n    class Klinik {\n        -KAPASITAS_PASIEN: int = 10$\n        -KAPASITAS_DOKTER: int = 5$\n        -KAPASITAS_KUNJUNGAN: int = 30$\n        -LOCALE_ID: Locale$\n        -nama: String\n        -alamat: String\n        -noTelepon: String\n        -daftarPasien: SortedList~Pasien~\n        -daftarDokter: SortedList~Dokter~\n        -daftarKunjungan: SortedList~Kunjungan~\n        -nomorKunjunganBerikutnya: int\n        +Klinik()\n        +Klinik(nama: String, alamat: String, noTelepon: String)\n        +tambahPasien(pasien: Pasien) void\n        +hapusPasien(kodePasien: String) Pasien\n        +cariPasien(kodePasien: String) Pasien\n        +cariPasienByNama(kataKunci: String) List~Pasien~\n        +tambahDokter(dokter: Dokter) void\n        +cariDokter(kodeDokter: String) Dokter\n        +cariDokterByNama(kataKunci: String) List~Dokter~\n        +ubahStatusDokter(kodeDokter: String, aktif: boolean) void\n        +buatKunjungan(kodePasien: String, kodeDokter: String, tanggal: LocalDate, keluhan: String) Kunjungan\n        +selesaikanKunjungan(kodeKunjungan: String, biayaObat: double) Kunjungan\n        +batalkanKunjungan(kodeKunjungan: String) Kunjungan\n        +cariKunjungan(kodeKunjungan: String) Kunjungan\n        +hitungKunjunganDokter(dokter: Dokter, tanggal: LocalDate) int\n        +hitungTotalPendapatan() double\n        +buatLaporan() String\n        +tampilkanInfo() String\n        +muatDataContoh() int\n        +formatRupiah(nilai: double)$ String\n        -buatKodeKunjungan() String\n        -cariKunjunganWajib(kodeKunjungan: String) Kunjungan\n        +getNama() String\n        +setNama(nama: String) void\n        +getAlamat() String\n        +setAlamat(alamat: String) void\n        +getNoTelepon() String\n        +setNoTelepon(noTelepon: String) void\n        +getDaftarPasien() SortedList~Pasien~\n        +getDaftarDokter() SortedList~Dokter~\n        +getDaftarKunjungan() SortedList~Kunjungan~\n    }\n\n    class Pasien {\n        -UMUR_MIN: int = 0$\n        -UMUR_MAX: int = 120$\n        -UMUR_LANSIA: int = 60$\n        -POTONGAN_BPJS: double = 0.50$\n        -POTONGAN_LANSIA: double = 0.20$\n        -POLA_KODE: String$\n        -POLA_TELEPON: String$\n        -kodePasien: String\n        -nama: String\n        -umur: int\n        -alamat: String\n        -noTelepon: String\n        -pesertaBpjs: boolean\n        -jumlahKunjungan: int\n        +Pasien()\n        +Pasien(kodePasien: String, nama: String, umur: int)\n        +Pasien(kodePasien: String, nama: String, umur: int, alamat: String, noTelepon: String, pesertaBpjs: boolean)\n        +getKategoriUmur() String\n        +isLansia() boolean\n        +hitungPersenPotongan() double\n        +tambahKunjungan() void\n        +tampilkanInfo() String\n        +getKunci() String\n        +toString() String\n        +getKodePasien() String\n        +setKodePasien(kodePasien: String) void\n        +getNama() String\n        +setNama(nama: String) void\n        +getUmur() int\n        +setUmur(umur: int) void\n        +getAlamat() String\n        +setAlamat(alamat: String) void\n        +getNoTelepon() String\n        +setNoTelepon(noTelepon: String) void\n        +isPesertaBpjs() boolean\n        +setPesertaBpjs(pesertaBpjs: boolean) void\n        +getJumlahKunjungan() int\n    }\n\n    class Dokter {\n        -MAKS_KUNJUNGAN_PER_HARI: int = 5$\n        -POLA_KODE: String$\n        -kodeDokter: String\n        -nama: String\n        -spesialis: String\n        -tarifKonsultasi: double\n        -aktif: boolean\n        +Dokter()\n        +Dokter(kodeDokter: String, nama: String, spesialis: String, tarifKonsultasi: double)\n        +Dokter(kodeDokter: String, nama: String, spesialis: String, tarifKonsultasi: double, aktif: boolean)\n        +bisaMenerimaKunjungan(jumlahKunjunganHariItu: int) boolean\n        +hitungSisaKuota(jumlahKunjunganHariItu: int) int\n        +ubahStatus(aktif: boolean) void\n        +getMaksKunjunganPerHari() int\n        +tampilkanInfo() String\n        +getKunci() String\n        +toString() String\n        +getKodeDokter() String\n        +setKodeDokter(kodeDokter: String) void\n        +getNama() String\n        +setNama(nama: String) void\n        +getSpesialis() String\n        +setSpesialis(spesialis: String) void\n        +getTarifKonsultasi() double\n        +setTarifKonsultasi(tarifKonsultasi: double) void\n        +isAktif() boolean\n        +setAktif(aktif: boolean) void\n    }\n\n    class Kunjungan {\n        -STATUS_MENUNGGU: String$\n        -STATUS_SELESAI: String$\n        -STATUS_BATAL: String$\n        -POLA_KODE: String$\n        -kodeKunjungan: String\n        -pasien: Pasien\n        -dokter: Dokter\n        -tanggal: LocalDate\n        -keluhan: String\n        -biayaObat: double\n        -status: String\n        +Kunjungan()\n        +Kunjungan(kodeKunjungan: String, pasien: Pasien, dokter: Dokter, tanggal: LocalDate, keluhan: String)\n        +hitungBiayaKonsultasi() double\n        +hitungTotalBiaya() double\n        +selesaikan(biayaObat: double) void\n        +batalkan() void\n        +isMenunggu() boolean\n        +isSelesai() boolean\n        +isBatal() boolean\n        +isAktifUntuk(dokter: Dokter, tanggal: LocalDate) boolean\n        +tampilkanInfo() String\n        +getKunci() String\n        +toString() String\n        +getKodeKunjungan() String\n        +setKodeKunjungan(kodeKunjungan: String) void\n        +getPasien() Pasien\n        +setPasien(pasien: Pasien) void\n        +getDokter() Dokter\n        +setDokter(dokter: Dokter) void\n        +getTanggal() LocalDate\n        +setTanggal(tanggal: LocalDate) void\n        +getKeluhan() String\n        +setKeluhan(keluhan: String) void\n        +getBiayaObat() double\n        +setBiayaObat(biayaObat: double) void\n        +getStatus() String\n    }\n\n    class Main {\n        -klinik: Klinik\n        -input: InputHelper\n        +Main()\n        +main(args: String[])$ void\n        +jalankan() void\n        -tampilkanMenuUtama() void\n        -menuTambahPasien() void\n        -menuTampilkanPasien() void\n        -menuTambahDokter() void\n        -menuTampilkanDokter() void\n        -menuBuatKunjungan() void\n        -menuKelolaKunjungan() void\n        -menuCariData() void\n        -menuOperasiAdt() void\n        -menuDataContoh() void\n    }\n\n    class InputHelper {\n        -scanner: Scanner\n        +InputHelper()\n        +InputHelper(scanner: Scanner)\n        +bacaBaris(prompt: String) String\n        +bacaTeksWajib(prompt: String) String\n        +bacaInt(prompt: String) int\n        +bacaInt(prompt: String, min: int, max: int) int\n        +bacaDouble(prompt: String) double\n        +bacaYaTidak(prompt: String) boolean\n        +bacaTanggal(prompt: String) LocalDate\n    }\n\n    Main \"1\" --> \"1\" Klinik : mengelola\n    Main \"1\" --> \"1\" InputHelper : membaca input\n    Main ..> Pasien : create\n    Main ..> Dokter : create\n    Klinik \"1\" o-- \"0..10\" Pasien : mendaftarkan\n    Klinik \"1\" o-- \"0..5\" Dokter : mempekerjakan\n    Klinik \"1\" *-- \"0..30\" Kunjungan : mencatat\n    Klinik \"1\" *-- \"3\" SortedList : menyimpan data\n    Kunjungan \"0..*\" --> \"1\" Pasien : milik pasien\n    Kunjungan \"0..*\" --> \"1\" Dokter : ditangani oleh\n    MemilikiKunci <|.. Pasien : realisasi\n    MemilikiKunci <|.. Dokter : realisasi\n    MemilikiKunci <|.. Kunjungan : realisasi\n    SortedList ..> MemilikiKunci : T extends\n";
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const gen = s => s.replace(/~([^~]*)~/g,'<$1>');
// ---- parse mermaid class blocks ----
const classes = {};
let cur = null;
for (let raw of SRC.split('\n')) {
  const l = raw.trim();
  let m = l.match(/^class (\w+)(~\w+~)? \{$/);
  if (m) { cur = {name: m[1] + (m[2] ? gen(m[2]) : ''), st: null, attrs: [], meths: []}; classes[m[1]] = cur; continue; }
  if (l === '}') { cur = null; continue; }
  if (!cur || !l) continue;
  m = l.match(/^<<(.+)>>$/);
  if (m) { cur.st = m[1]; continue; }
  let stat = l.endsWith('$') || /\)\$ /.test(l);
  let t = l.replace(/\)\$ /, ') ').replace(/\$$/, '');
  const vis = t[0]; t = t.slice(1);
  let txt;
  if (t.includes('(')) {
    const i = t.lastIndexOf(')');
    const sig = t.slice(0, i + 1), ret = t.slice(i + 1).trim();
    txt = vis + ' ' + gen(sig) + (ret ? ' : ' + gen(ret) : '');
    cur.meths.push([txt, stat]);
  } else {
    const [n, ...rest] = t.split(':');
    txt = vis + ' ' + n.trim() + ' : ' + gen(rest.join(':').trim());
    cur.attrs.push([txt, stat]);
  }
}
const kind = {Pasien:'entity',Dokter:'entity',Kunjungan:'entity',Klinik:'entity',SortedList:'adt',MemilikiKunci:'adt',Main:'app',InputHelper:'app'};
const cv = document.getElementById('canvas');
for (const [id, c] of Object.entries(classes)) {
  const d = document.createElement('div');
  d.className = 'cls ' + kind[id]; d.id = id;
  const st = id === 'MemilikiKunci' ? '«interface»' : (id === 'SortedList' ? '«ADT» T extends MemilikiKunci' : '');
  const sec = arr => '<div class="sec">' + (arr.length ? arr.map(([t,s]) => s ? '<span class="u">'+esc(t)+'</span>' : esc(t)).join('<br>') : '&nbsp;') + '</div>';
  d.innerHTML = '<div class="hd">' + (st ? '<span class="st">'+esc(st)+'</span>' : '') + esc(c.name) + '</div>' + sec(c.attrs) + sec(c.meths);
  cv.appendChild(d);
}
// ---- layout ----
const $ = id => document.getElementById(id);
const W = id => $(id).offsetWidth, H = id => $(id).offsetHeight;
const place = (id, x, y) => { $(id).style.left = x + 'px'; $(id).style.top = y + 'px'; };
const top1 = 120, gap = 110;
place('Main', 40, top1);
place('InputHelper', 40, top1 + H('Main') + 120);
const kx = 40 + Math.max(W('Main'), W('InputHelper')) + gap;
place('Klinik', kx, top1);
const sx = kx + W('Klinik') + gap + 40;
place('SortedList', sx, top1);
place('MemilikiKunci', sx + (W('SortedList') - W('MemilikiKunci')) / 2, top1 + H('SortedList') + 120);
const row1b = Math.max(top1 + H('Klinik'), $('InputHelper').offsetTop + H('InputHelper'), $('MemilikiKunci').offsetTop + H('MemilikiKunci'));
const top2 = row1b + 190;
place('Pasien', 40, top2);
place('Kunjungan', 40 + W('Pasien') + 150, top2);
place('Dokter', $('Kunjungan').offsetLeft + W('Kunjungan') + 150, top2);
const R = id => { const e = $(id); const l = e.offsetLeft, t = e.offsetTop, w = e.offsetWidth, h = e.offsetHeight;
  return {l, t, r: l + w, b: t + h, cx: l + w / 2, cy: t + h / 2, w, h}; };
const totalW = Math.max(R('Dokter').r, R('SortedList').r) + 60;
const bottom2 = Math.max(R('Pasien').b, R('Kunjungan').b, R('Dokter').b);
// ---- edges ----
const svg = $('svg');
const NS = 'http://www.w3.org/2000/svg';
function line(pts, o) {
  const p = document.createElementNS(NS, 'polyline');
  p.setAttribute('points', pts.map(q => q.join(',')).join(' '));
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', o.color || '#2f3b4c'); p.setAttribute('stroke-width', 2);
  if (o.dash) p.setAttribute('stroke-dasharray', '8 6');
  if (o.start) p.setAttribute('marker-start', 'url(#' + o.start + ')');
  if (o.end) p.setAttribute('marker-end', 'url(#' + o.end + ')');
  svg.appendChild(p);
}
function text(x, y, s, cls, anchor) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('class', 'lbl ' + (cls || ''));
  t.setAttribute('text-anchor', anchor || 'start'); t.textContent = s; svg.appendChild(t);
}
const K = R('Klinik'), P = R('Pasien'), D = R('Dokter'), U = R('Kunjungan'), S = R('SortedList'),
      I = R('MemilikiKunci'), M = R('Main'), IH = R('InputHelper');
const AGG = {start:'dia0'}, COMP = {start:'dia1'}, ASSOC = {end:'open'}, DEP = {end:'open', dash:1}, REAL = {end:'tri', dash:1, color:'#3f7d32'};
// Main -> Klinik (association)
let y = M.t + 40; line([[M.r, y], [K.l, y]], ASSOC);
text(M.r + 12, y - 8, '1'); text(K.l - 12, y - 8, '1', '', 'end'); text((M.r + K.l) / 2, y + 22, 'mengelola', 'name', 'middle');
// Main -> InputHelper
let x = M.l + 80; line([[x, M.b], [x, IH.t]], ASSOC);
text(x + 10, M.b + 20, '1'); text(x + 10, IH.t - 8, '1'); text(x + 14, (M.b + IH.t) / 2 + 5, 'membaca input', 'name');
// Main ..> Pasien (create)
x = M.l + 20; line([[M.l + 20, M.b], [x, M.b + 50], [20, M.b + 50], [20, P.t - 40], [P.l + 40, P.t - 40], [P.l + 40, P.t]], DEP);
text(28, P.t - 50, '«create»', 'name');
// Klinik -> SortedList (composition)
y = S.t + 50; line([[K.r, y], [S.l, y]], COMP);
text(K.r + 30, y - 8, '1'); text(S.l - 12, y - 8, '3', '', 'end'); text((K.r + S.l) / 2, y + 22, 'menyimpan data', 'name', 'middle');
// SortedList ..> MemilikiKunci
line([[S.cx, S.b], [S.cx, I.t]], DEP); text(S.cx + 12, (S.b + I.t) / 2 + 5, '«use» T extends', 'name');
// Klinik -> Pasien / Kunjungan / Dokter
const midA = K.b + 60, midB = K.b + 100;
x = K.l + 60;  line([[x, K.b], [x, midA], [P.cx, midA], [P.cx, P.t]], AGG);
text(x + 12, K.b + 34, '1'); text(P.cx + 10, P.t - 10, '0..10'); text(P.cx + 10, midA - 10, 'mendaftarkan', 'name');
x = K.cx; line([[x, K.b], [x, midB], [U.cx, midB], [U.cx, U.t]], COMP);
text(x + 12, K.b + 34, '1'); text(U.cx + 10, U.t - 10, '0..30'); text(U.cx + 10, midB + 24, 'mencatat', 'name');
x = K.r - 60; line([[x, K.b], [x, midA], [D.cx, midA], [D.cx, D.t]], AGG);
text(x + 12, K.b + 34, '1'); text(D.cx + 10, D.t - 10, '0..5'); text(D.cx - 10, midA - 10, 'mempekerjakan', 'name', 'end');
// Kunjungan -> Pasien / Dokter (association)
y = U.t + 90; line([[U.l, y], [P.r, y]], ASSOC);
text(U.l - 10, y - 8, '0..*', '', 'end'); text(P.r + 12, y - 8, '1'); text((U.l + P.r) / 2, y + 22, 'milik pasien', 'name', 'middle');
line([[U.r, y], [D.l, y]], ASSOC);
text(U.r + 10, y - 8, '0..*'); text(D.l - 12, y - 8, '1', '', 'end'); text((U.r + D.l) / 2, y + 22, 'ditangani oleh', 'name', 'middle');
// realisasi ke MemilikiKunci lewat jalur bawah lalu kanan
const busY = bottom2 + 50, busX = totalW - 20;
for (const [b, off] of [[P, 0], [U, 0], [D, 0]]) line([[b.cx, b.b], [b.cx, busY], [busX, busY]], {color:'#3f7d32', dash:1});
line([[busX, busY], [busX, I.cy], [I.r, I.cy]], REAL);
text(busX - 10, busY + 24, 'realisasi: Pasien, Kunjungan, Dokter mengimplementasikan MemilikiKunci', 'name', 'end');
// legenda
const lg = document.createElement('div'); lg.id = 'legend';
lg.innerHTML = '<b>Keterangan</b><br>- private &nbsp; + public &nbsp; <u>garis bawah</u> = static<br>' +
 '◇ agregasi &nbsp; ◆ komposisi &nbsp; → asosiasi<br>⇢ dependensi (putus-putus) &nbsp; ▷ realisasi interface';
cv.appendChild(lg);
lg.style.left = (M.l) + 'px'; lg.style.top = (IH.b + 40) + 'px';
const totalH = busY + 60;
cv.style.width = totalW + 'px'; cv.style.height = totalH + 'px';
svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
document.title = totalW + 'x' + totalH;
</script></body></html>
